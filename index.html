<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sheenaz's Learning Hub</title>
<style>
  :root {
    --bg-1: #ffd5e5;
    --bg-2: #c2f0fc;
    --bg-3: #fff2b2;
    --ink: #2b2d42;
    --card: #ffffff;
    --accent: #ff4d94;
    --accent-2: #4dc3ff;
    --accent-3: #ffb347;
    --accent-4: #7ad67a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Comic Sans MS', 'Trebuchet MS', system-ui, sans-serif;
    color: var(--ink);
    min-height: 100vh;
    background:
      radial-gradient(circle at 10% 10%, var(--bg-1) 0%, transparent 40%),
      radial-gradient(circle at 90% 20%, var(--bg-2) 0%, transparent 45%),
      radial-gradient(circle at 50% 90%, var(--bg-3) 0%, transparent 50%),
      linear-gradient(180deg, #fff 0%, #f6f9ff 100%);
  }
  header {
    text-align: center;
    padding: 56px 20px 16px;
  }
  header h1 {
    margin: 0;
    font-size: clamp(2.2rem, 6vw, 4rem);
    background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--accent-3));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: 1px;
  }
  header p {
    margin: 10px 0 0;
    font-size: 1.15rem;
    opacity: 0.8;
  }
  .wave {
    display: inline-block;
    animation: wave 1.6s infinite;
    transform-origin: 70% 70%;
  }
  @keyframes wave {
    0%, 60%, 100% { transform: rotate(0deg); }
    10% { transform: rotate(14deg); }
    20% { transform: rotate(-8deg); }
    30% { transform: rotate(14deg); }
    40% { transform: rotate(-4deg); }
    50% { transform: rotate(10deg); }
  }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 20px 64px;
  }
  .grid {
    display: grid;
    gap: 26px;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  }
  .tile {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: var(--card);
    border-radius: 24px;
    padding: 48px 28px;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 12px 28px rgba(43, 45, 66, 0.10);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    overflow: hidden;
    border-top: 8px solid var(--accent);
    min-height: 240px;
  }
  .tile:hover {
    transform: translateY(-6px) rotate(-0.5deg);
    box-shadow: 0 18px 36px rgba(43, 45, 66, 0.18);
  }
  .tile .emoji {
    font-size: 4rem;
    line-height: 1;
    margin-bottom: 12px;
  }
  .tile h2 {
    margin: 0 0 8px;
    font-size: 1.8rem;
  }
  .tile p {
    margin: 0 0 18px;
    opacity: 0.75;
    font-size: 1rem;
  }
  .tile .go {
    font-weight: bold;
    padding: 10px 18px;
    border-radius: 999px;
    background: var(--accent);
    color: white;
    font-size: 0.95rem;
  }
  .tile.english { border-top-color: var(--accent-3); }
  .tile.english .go { background: var(--accent-3); }
  footer {
    text-align: center;
    padding: 20px;
    font-size: 0.85rem;
    opacity: 0.55;
  }
</style>
</head>
<body>
  <header>
    <h1>Hi Sheenaz <span class="wave">👋</span></h1>
    <p>Pick a subject to get started!</p>
  </header>

  <main>
    <div class="grid">
      <a class="tile math" href="math/index.html">
        <div class="emoji">🧮</div>
        <h2>Math</h2>
        <p>Textbook, practice sheets, and homework.</p>
        <span class="go">Open Math →</span>
      </a>

      <a class="tile english" href="english/index.html">
        <div class="emoji">📚</div>
        <h2>English</h2>
        <p>Stories, assessments, and homework.</p>
        <span class="go">Open English →</span>
      </a>
    </div>
  </main>

  <footer>
    Made with ❤️ for Sheenaz
  </footer>
</body>
</html>
